name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install GreyLog
        run: python -m pip install .
      - name: Run unit and API tests
        run: python -m unittest discover -s tests -v
      - name: Check dashboard JavaScript
        run: node --check greylog/web/app.js
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Check wheel assets
        run: python -c "import glob, zipfile; z = zipfile.ZipFile(glob.glob('dist/greylog-*.whl')[0]); names = set(z.namelist()); required = {'greylog/web/index.html', 'greylog/web/styles.css', 'greylog/web/app.js', 'greylog/web/owl.png'}; assert required <= names, required - names; assert any(n.endswith('/licenses/LICENSE') for n in names); assert any(n.endswith('/licenses/NOTICE') for n in names)"
      - name: Build Debian package
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: bash packaging/debian/build-deb.sh
      - name: Check Debian package
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          dpkg-deb --field dist/greylog_0.1.3-1_all.deb Package Version Architecture
          dpkg-deb --contents dist/greylog_0.1.3-1_all.deb | grep -F 'usr/bin/greylog'
          stage=$(mktemp -d)
          trap 'rm -rf "$stage"' EXIT
          dpkg-deb --extract dist/greylog_0.1.3-1_all.deb "$stage"
          PYTHONPATH="$stage/usr/lib/python3/dist-packages" python -m greylog --help
          mkdir -p "$stage/shadow/greylog"
          printf 'raise SystemExit("shadow package loaded")\n' > "$stage/shadow/greylog/__main__.py"
          (cd "$stage/shadow" && PYTHONPATH="$stage/usr/lib/python3/dist-packages" "$stage/usr/bin/greylog" --help)
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.19.0
      - name: Build portable EXE and installable ZIP
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - name: Smoke test portable EXE
        run: python packaging/windows/smoke_portable.py dist/windows/GreyLog-windows-x64.exe
      - name: Smoke test per-user installation
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'GreyLog-bundle'
          $installed = Join-Path $env:RUNNER_TEMP 'GreyLog-installed'
          $data = Join-Path $env:RUNNER_TEMP 'GreyLog-data'
          Expand-Archive -LiteralPath dist/windows/GreyLog-windows-x64-installable.zip -DestinationPath $bundle
          & (Join-Path $bundle 'Install-GreyLog.ps1') -InstallRoot $installed -DataRoot $data -NoRegistration
          & (Join-Path $installed 'GreyLog.exe') --help
          & (Join-Path $installed 'Uninstall-GreyLog.ps1') -InstallRoot $installed -NoRegistration
          if (Test-Path -LiteralPath (Join-Path $installed 'GreyLog.exe')) { throw 'Uninstall left the EXE behind' }
      - uses: actions/upload-artifact@v4
        with:
          name: GreyLog-Windows-portable-and-installer
          path: |
            dist/windows/GreyLog-windows-x64.exe
            dist/windows/GreyLog-windows-x64-installable.zip
